version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only through the project logging package
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 20
    govet:
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 140
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gochecknoinits
          - goconst
          - gocritic
          - gocyclo
          - lll
          - mnd
      - path: cmd/bluge/cmd
        linters:
          - gochecknoinits
      - path: sizes.go
        linters:
          - gochecknoinits
      - path: _test\.go
        linters:
          - gosec
        text: G404
      - path: index/lock/lock_test.go
        linters:
          - gosec
        text: G204
      - path: ^vector_usearch_integration_test\.go$
        linters:
          - gosec
        text: G703
      - path: index/optimize.go
        linters:
          - funlen
      - path: index/persister.go
        linters:
          - funlen
        text: persisterLoop
      - path: ^analysis/.*_test\.go$
        linters:
          - dupl
          - misspell
      - path: analysis/lang/
        linters:
          - staticcheck
        text: ST1018
      - path: ^analysis/lang/.*\.go$
        linters:
          - dupl
          - funlen
          - gocyclo
          - misspell
          - mnd
      - path: analysis/lang/in/scripts.go
        linters:
          - gochecknoinits
      - path: analysis/freq.go
        linters:
          - gochecknoinits
      - path: search/searcher/search_fuzzy.go
        linters:
          - gochecknoinits
      - path: analysis/tokenizer/web.go
        linters:
          - lll
      - path: analysis/char/asciifolding.go
        linters:
          - funlen
          - gocritic
          - gocyclo
      - path: numeric/geo/sloppy.go
        linters:
          - gochecknoinits
          - mnd
      - path: numeric/prefix_coded.go
        linters:
          - mnd
      - path: size.go
        linters:
          - gochecknoinits
      - linters:
          - gocritic
        text: 'unnecessaryDefer:'
      - linters:
          - gocritic
        text: config is heavy

      # Section registration is intentionally performed during package init.
      - path: ^internal/zapxtext/vector_section\.go$
        linters:
          - gochecknoinits

      # These routines validate and merge several independent search states.
      # Refactoring them immediately before release would add behavioral risk.
      - path: ^(internal/zapxtext/vector_section|vector_(flat|search|usearch|usearch_embedded))\.go$
        linters:
          - gocyclo
          - funlen

      # Vector sidecar paths come from the trusted index configuration and are
      # used directly for persistence; they are not derived from query input.
      - path: ^vector_(flat|usearch)\.go$
        linters:
          - gosec
        text: G703
    paths:
      - test/testdata_etc
      - internal/cache
      - internal/renameio
      - internal/robustio
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fy0/bluge
  exclusions:
    generated: lax
    paths:
      - test/testdata_etc
      - internal/cache
      - internal/renameio
      - internal/robustio
      - third_party$
      - builtin$
      - examples$

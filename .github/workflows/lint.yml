on:
  push:
    branches:
      - master
  pull_request:
name: Lint

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: 1.24.6
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --new-from-rev=v0.5.0 --timeout=5m
